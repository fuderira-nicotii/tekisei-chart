<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf6"><title>にこふで適性診断チャート</title>
<style>
:root{--ink:#4e4945;--muted:#898078;--coral:#efa18a;--coral-dark:#dc896f;--cream:#fffaf6;--beige:#f8efdf;--line:#f0e5dc;--lav:#f1edf7;--mint:#eaf3ed;--blue:#eaf1f6}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.8}.app{width:min(100%,520px);min-height:100dvh;margin:auto;background:linear-gradient(180deg,#fff 0%,#fffaf7 100%);padding:24px 22px 38px}.screen{display:none}.screen.active{display:block}.start{min-height:calc(100dvh - 62px);display:flex;flex-direction:column;justify-content:center;text-align:center;padding:14px 0}.eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 auto 8px;padding:4px 14px;border-radius:999px;background:#fbf1df;color:#a98455;font-size:13px;font-weight:600}.spark{color:#c9a16f;font-size:18px}.hero-title{font-size:17px;font-weight:700;margin:0 0 2px}.hero-title strong{display:block;color:#e58d70;font-size:23px;letter-spacing:.02em;margin-top:2px}.sub{color:#8a837d;font-size:14px;letter-spacing:.06em;margin:12px 0 30px}.btn{border:0;border-radius:14px;padding:15px 18px;font:inherit;font-weight:700;cursor:pointer;transition:transform .12s,opacity .12s}.btn:active{transform:scale(.99)}.primary{background:linear-gradient(100deg,#f0a48e,#e9957c);color:#fff;box-shadow:0 4px 0 #f8e4da}.secondary{background:#f8f0e8;color:#947b68}.start .primary{width:100%;margin-top:4px}.tiny{font-size:12px;color:#a39a93;margin-top:17px}.topline{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#a28e7f;margin-bottom:10px}.progress{height:5px;border-radius:99px;background:#f5e9e1;overflow:hidden;margin-bottom:27px}.progress span{display:block;height:100%;width:0;background:#eaa087;border-radius:99px;transition:width .2s}.qnum{font-size:13px;color:#d38d74;font-weight:700;letter-spacing:.08em;margin:0 0 8px}.question{font-size:21px;line-height:1.55;margin:0 0 23px;font-weight:700;letter-spacing:.01em}.options{display:grid;gap:11px}.option{display:flex;align-items:center;gap:13px;text-align:left;width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:15px 14px;color:var(--ink);font-size:15px;line-height:1.6;cursor:pointer;min-height:64px}.option .letter{flex:0 0 35px;width:35px;height:35px;display:grid;place-items:center;border-radius:50%;font-weight:700;color:#a77761;background:#fbefe7}.option:nth-child(2) .letter{background:#f1edf7;color:#8c7ba7}.option:nth-child(3) .letter{background:#eaf3ed;color:#71947d}.option:nth-child(4) .letter{background:#eaf1f6;color:#7191a6}.option.selected{border:2px solid #eaa087;background:#fff8f4;padding:14px 13px}.option.selected .letter{background:#eaa087;color:#fff}.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.navrow .btn{flex:1}.result-kicker{text-align:center;color:#b08d6d;font-size:13px;font-weight:700}.result h2{text-align:center;font-size:24px;line-height:1.45;margin:5px 0 4px}.result .type{color:#e58d70;font-size:18px;text-align:center;font-weight:700;margin:0 0 18px}.result-card{border:1px solid #f0e4da;background:#fff;border-radius:20px;padding:22px 19px;margin:18px 0}.result-card p{margin:0 0 12px}.result-card p:last-child{margin-bottom:0}.result-card .lead{font-weight:700;color:#e58d70}.type-tag{display:inline-block;background:#fbf0e6;border-radius:99px;padding:5px 12px;color:#a37b60;font-size:12px;font-weight:700}.message-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;background:#f8f0e8;border:0;border-radius:14px;padding:15px 16px;color:#806b5b;font:inherit;font-weight:700;cursor:pointer;text-align:left}.message-content{display:none;padding:18px 15px 5px;white-space:normal}.message-content.open{display:block}.message-content p{margin:0 0 12px}.linkbox{margin-top:22px;padding:19px;border-radius:18px;background:#fff4ed;text-align:center}.linkbox h3{font-size:17px;margin:0 0 7px}.linkbox p{font-size:13px;color:#887a70;margin:0 0 14px}.linkbox .btn{display:block;text-decoration:none;margin-top:10px}.linkbox .primary{color:#fff}.linkbox .secondary{color:#8e7464}.counts{display:flex;gap:8px;justify-content:center;margin:13px 0 3px}.count{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:54px;text-align:center;font-size:12px;color:#8a7c72}.count b{display:block;font-size:18px;color:#b7856e}.foot{text-align:center;font-size:11px;color:#b0a69e;margin-top:22px}.hidden{display:none!important}@media(min-width:520px){body{background:#f7f2ed}.app{box-shadow:0 0 30px #e9ddd344}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><main class="app">
<section id="start" class="screen active"><div class="start"><p class="eyebrow">自分に合った楽しみ方がわかる <span class="spark">✧</span></p><p class="hero-title">私に合っているのかな？<strong>にこふで適性診断チャート</strong></p><p class="sub">質問に答えてあなたにぴったりの<br>「にこふでの楽しみ方」「おすすめ講座」を見つけよう♪</p><button class="btn primary" id="begin">診断をはじめる</button><p class="tiny">全10問・直感で選んでね</p></div></section>
<section id="quiz" class="screen"><div class="topline"><span>にこふで適性診断</span><span id="stepLabel">1 / 10</span></div><div class="progress"><span id="progressBar"></span></div><p class="qnum" id="qnum">QUESTION 01</p><h1 class="question" id="question"></h1><div class="options" id="options"></div><div class="navrow"><button class="btn secondary" id="back">ひとつ戻る</button><button class="btn primary" id="next" disabled>次へ</button></div><p class="foot">正解・不正解はありません。今の気持ちで選んでね♡</p></section>
<section id="result" class="screen result"><p class="result-kicker">YOUR DIAGNOSIS</p><h2 id="resultTitle"></h2><p class="type" id="resultType"></p><div class="counts" id="counts"></div><div class="result-card" id="resultBody"></div><button class="message-toggle" id="messageToggle" aria-expanded="false"><span>あなたへのメッセージ</span><span id="toggleIcon">＋</span></button><div class="message-content" id="messageContent"></div><div class="linkbox"><h3>あなたにおすすめの次の一歩</h3><p id="offerText">あなたに合った楽しみ方を、もう少し見つけてみませんか？</p><a class="btn primary" id="courseLink" href="#" target="_blank" rel="noopener">おすすめ講座を見てみる</a><a class="btn secondary" id="lineLink" href="#" target="_blank" rel="noopener">公式LINEで詳しく見る</a></div><button class="btn secondary" id="retry" style="width:100%;margin-top:20px">もう一度診断する</button><p class="foot">診断結果は、今のあなたの気持ちを知るヒントです♡</p></section>
</main>
<script>
/* ===================== 設定欄：リンクや講座名はここで変更できます ===================== */
const CONFIG = {
  lineUrl: "https://line.me/", // 公式LINEの登録URLに変更してください
  types: {
    A: { courseName: "にこふでギフトタイプにおすすめの講座", courseUrl: "", offerText: "大切な人を想う気持ちを、筆文字やイラストで形にしてみませんか？" },
    B: { courseName: "にこふでクリエイタータイプにおすすめの講座", courseUrl: "", offerText: "まずは楽しみながら、あなたらしい作品づくりを始めてみませんか？" },
    C: { courseName: "癒しのにこふでタイプにおすすめの講座", courseUrl: "", offerText: "自分の心を大切にする時間として、筆文字を楽しんでみませんか？" },
    D: { courseName: "にこふで起業タイプにおすすめの講座", courseUrl: "", offerText: "好きなことを仕事にする一歩を、具体的に考えてみませんか？" }
  }
};
/* ================================================================================ */
const QUESTIONS = [
 {q:"自由に使える時間が1時間できたら、何をしたい？",a:["家族のために何かしてあげたい","好きなことをして自分を満たしたい","ゆっくりして心を休めたい","新しいことにチャレンジしてみたい"]},
 {q:"お店やSNSで「素敵だな♡」と思うものを見つけたら？",a:["大切な人にプレゼントしたくなる","「私もこんなの作ってみたい！」と思う","見ているだけで癒される","「これって仕事にもできるのかな？」と考える"]},
 {q:"「絵を描く」と聞いて、いちばん近い気持ちは？",a:["誰かに喜んでもらえるなら描いてみたい","上手じゃなくても楽しそう！","描いている時間そのものが楽しそう","できるようになったら作品として届けてみたい"]},
 {q:"最近、自分のためにできていることは？",a:["ほとんどできていないかも","好きなことを少し楽しめている","休む時間を意識している","やりたいことに少しずつ挑戦している"]},
 {q:"もし「失敗しても誰にも笑われない」としたら？",a:["誰かのために作品を作ってみたい","筆文字やイラストをやってみたい","自分の気持ちを自由に表現してみたい","好きなことを仕事にしてみたい"]},
 {q:"「ありがとう」を伝えるなら、どんな方法が嬉しい？",a:["心を込めた手書きの言葉","イラストや筆文字を添えた作品","自分の言葉でゆっくり伝える","相手だけの特別な作品を作って贈る"]},
 {q:"あなたが今、一番ほしいものは？",a:["誰かに必要とされている実感","「私にもできる！」という自信","心の余裕と安心","自分らしい働き方"]},
 {q:"「好きなことを仕事にできるよ」と言われたら？",a:["誰かの役に立てるならやってみたい","えっ、本当に？私にもできる？","まずは自分が楽しめることから始めたい","どうやったら仕事にできるのか知りたい！"]},
 {q:"作品を作るなら、どんなものを作ってみたい？",a:["家族や大切な人への贈り物","自分が「かわいい♡」と思える作品","見ると心がほっとする作品","誰かから「これ欲しい！」と言ってもらえる作品"]},
 {q:"最後に、今のあなたに一番近い言葉は？",a:["誰かを笑顔にしたい","私も何か始めてみたい","まずは自分を大切にしたい","好きなことを仕事にしてみたい"]}
];
const RESULTS={
 A:{title:"「誰かの笑顔がうれしい♡」",type:"想いを届ける【にこふでギフトタイプ】",body:["あなたは、","「自分が何かをすることで、誰かが笑顔になる」","ことに大きな喜びを感じるタイプ。","プレゼントを選ぶときも、","「これをもらったら喜んでくれるかな？」","と、相手のことを考えるのではないでしょうか。","そんなあなたと相性がいいのが","筆文字×イラストの贈りもの。","上手に描くことより、","「この人に喜んでもらいたい」","という気持ちが、作品の魅力になります。"],message:["あなたが持っている","「誰かを想う気持ち」は、","それだけでもう","素敵な才能です。","もし「描いてみたい」が少しでもあるなら、","まずは身近な人へ","一枚描いてみるところから始めてみてください♡"]},
 B:{title:"「やってみたい♡」が眠っている",type:"自分らしく楽しむ【にこふでクリエイタータイプ】",body:["あなたは、","「好き！」という気持ちから動ける人。","かわいいものを見つけると、","「私も作ってみたい！」","と思ったり、","「こんなの描けたら楽しそう♡」","とワクワクしたり。","そんなあなたは、","筆文字×イラストとの相性がとてもいいタイプです。","そして大切なのは、","「上手に描けるようになってから始める」","ではなく、","「やってみたいから始める」こと。","最初から上手な人なんていません。","線一本。","丸ひとつ。","そこから「私の作品」が始まります。"],message:["もしかしたら今まで、","「私なんて…」","って、自分の「好き」を後回しにしてきませんでしたか？","もう少しだけ、","「私、やってみてもいいかも♡」","を大切にしてみてくださいね。"]},
 C:{title:"心を整えながら楽しみたい",type:"自分を満たす【癒しのにこふでタイプ】",body:["あなたは、頑張ることよりも、","「心がほっとする時間」","を大切にしたいタイプ。","毎日、家族や仕事のことを優先して、","気がついたら自分のことは後回し。","そんなことはありませんか？","筆文字は、","「上手に描かなきゃ」","ではなく、","筆を動かしながら","自分の気持ちと向き合う時間にもできます。","「今日も頑張ったね」","「大丈夫」","「ありがとう」","そんな言葉を自分に贈ることから始めてもいいんです。"],message:["誰かを幸せにする前に、","まずはあなた自身の心を","少し満たしてあげてください。","安心できる時間が増えると、","自然と笑顔も増えていきます。","あなたにとって筆文字は、","「作品を作るため」だけではなく、","自分を大切にする時間","になるかもしれません♡"]},
 D:{title:"「好き」を一歩先へ進めたい",type:"好きをカタチにする【にこふで起業タイプ】",body:["あなたは、","「好きなことを仕事にできたらいいな」","という気持ちを持っているタイプ。","でも、","「私にできるのかな？」","「仕事にするなんて無理じゃない？」","と、まだ少しブレーキがかかっているかもしれません。","でもね。","起業に必要なのは、","最初から完璧な技術でも","特別な才能でもありません。","まずは、","「これ、好きかも」","という小さな気持ちを大切にすること。","筆文字やイラストを楽しみながら、","「誰かに届ける」","「喜んでもらう」","という経験を少しずつ積み重ねる。","その先に、","「好きなことを仕事にする」","という道もあります。"],message:["「いつかやりたい」","と思っていることがあるなら、","その「いつか」を","少しだけ「今日」に近づけてみませんか？","あなたの「好き」は、","誰かの笑顔につながるかもしれません。"]}
};
const letters=['A','B','C','D'];let current=0;let answers=Array(QUESTIONS.length).fill(null);
const $=id=>document.getElementById(id);function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
$('begin').addEventListener('click',()=>{current=0;renderQuestion();show('quiz')});$('back').addEventListener('click',()=>{if(current>0){current--;renderQuestion()}else show('start')});$('next').addEventListener('click',()=>{if(answers[current]===null)return;if(current<QUESTIONS.length-1){current++;renderQuestion()}else renderResult()});
function renderQuestion(){const item=QUESTIONS[current];$('stepLabel').textContent=`${current+1} / ${QUESTIONS.length}`;$('qnum').textContent=`QUESTION ${String(current+1).padStart(2,'0')}`;$('question').textContent=item.q;$('progressBar').style.width=`${(current+1)/QUESTIONS.length*100}%`;$('options').innerHTML='';item.a.forEach((answer,i)=>{const letter=letters[i];const b=document.createElement('button');b.type='button';b.className='option'+(answers[current]===letter?' selected':'');b.setAttribute('aria-pressed',answers[current]===letter?'true':'false');const l=document.createElement('span');l.className='letter';l.textContent=letter;const t=document.createElement('span');t.textContent=answer;b.append(l,t);b.addEventListener('click',()=>{answers[current]=letter;renderQuestion()});$('options').appendChild(b)});$('back').textContent=current===0?'最初に戻る':'ひとつ戻る';$('next').disabled=answers[current]===null;$('next').textContent=current===QUESTIONS.length-1?'診断結果を見る':'次へ';}
function renderResult(){const counts={A:0,B:0,C:0,D:0};answers.forEach(a=>{if(a)counts[a]++});const max=Math.max(...Object.values(counts));const tied=letters.filter(l=>counts[l]===max);const primary=tied[0];const secondary=tied[1]||null;const r=RESULTS[primary];$('resultTitle').textContent=r.title;$('resultType').textContent=r.type+(secondary?`（${secondary}の要素もあり）`:"");$('counts').innerHTML=letters.map(l=>`<div class="count"><b>${counts[l]}</b>${l}タイプ</div>`).join('');$('resultBody').innerHTML='';r.body.forEach(line=>{const p=document.createElement('p');p.textContent=line;if(line.startsWith('「')||line==='筆文字×イラストの贈りもの'||line==='素敵な才能です。')p.className='lead';$('resultBody').appendChild(p)});$('messageContent').innerHTML='';r.message.forEach(line=>{const p=document.createElement('p');p.textContent=line;$('messageContent').appendChild(p)});$('messageContent').classList.remove('open');$('messageToggle').setAttribute('aria-expanded','false');$('toggleIcon').textContent='＋';const cfg=CONFIG.types[primary];$('offerText').textContent=cfg.offerText||'あなたに合った楽しみ方を、もう少し見つけてみませんか？';$('courseLink').textContent=cfg.courseName||'おすすめ講座を見てみる';setLink($('courseLink'),cfg.courseUrl);setLink($('lineLink'),CONFIG.lineUrl);show('result')}
function setLink(el,url){el.onclick=null;if(url&&url.trim()){el.href=url;el.classList.remove('hidden');el.setAttribute('aria-disabled','false')}else{el.href='#';el.classList.remove('hidden');el.onclick=(e)=>{e.preventDefault();alert('設定欄（CONFIG）にリンクURLを入力してください。')};}}
$('messageToggle').addEventListener('click',()=>{const open=$('messageContent').classList.toggle('open');$('messageToggle').setAttribute('aria-expanded',String(open));$('toggleIcon').textContent=open?'－':'＋'});$('retry').addEventListener('click',()=>{answers=Array(QUESTIONS.length).fill(null);current=0;renderQuestion();show('start')});
</script></body></html>
